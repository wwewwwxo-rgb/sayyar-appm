
name: Build SAYYAR APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check source files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android platform
        run: |
          flutter create \
            --platforms=android \
            --org com.sayyar.app \
            --project-name sayyar \
            /tmp/sayyar_android
          cp -R /tmp/sayyar_android/android ./android

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pos = s.find(">")

          if pos == -1:
              raise SystemExit("Invalid AndroidManifest.xml")

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in s:
              s = s[:pos + 1] + permissions + s[pos + 1:]

          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
